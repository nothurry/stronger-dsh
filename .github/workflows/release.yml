# Release 0.19.42: open the selected child review scope.
name: Publish audited release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build:rewind
      - run: git diff --exit-code -- lib/client.js lib/rewind.js
      - run: npm test
      - run: node lib/check-public.js
      - name: Pack and audit
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          node lib/check-public.js --archive "dist/dsh-ui-stronger-$version.tgz"
          cd dist
          sha256sum "dsh-ui-stronger-$version.tgz" > "dsh-ui-stronger-$version.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          gh release create "v$version" "dist/dsh-ui-stronger-$version.tgz" "dist/dsh-ui-stronger-$version.sha256" --target "$GITHUB_SHA" --title "Stronger DSH $version" --notes "Retains current branch restrictions across compaction and isolates OCR requests and local voice redirects. See README for verification and limits."
